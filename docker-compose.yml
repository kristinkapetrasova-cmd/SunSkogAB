name: sunskogab

services:
  sqldata:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sunskog_sqldata
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -lc 'grep -q \"SQL Server is now ready for client connections\" /var/opt/mssql/log/errorlog'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mssqldata:/var/opt/mssql

  api:
    build:
      context: ./SunSkog.Api
      dockerfile: Dockerfile
    container_name: sunskog_api
    depends_on:
      sqldata:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqldata,1433;Database=SunSkogDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: super_dev_secret_please_changeJwt__Key=CHANGE_ME_super_long_dev_secret_key_at_least_32_chars_please_1234567890
      Admin__Email: admin@sunskog.local
      Admin__Password: Admin123!
    ports:
      - "5250:8080"

volumes:
  mssqldata: